<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060A">
<meta name="robots" content="noindex">
<title>Page not found · Omowole Precious Michael</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..600&family=Geist+Mono:wght@400&family=Instrument+Serif:ital@1&display=swap">
<style>
:root { --bg: #05060A; --fg: #F3F5F9; --muted: #A3AAB7; --faint: #7D8596; --accent: #8EA8FF; --teal: #45D9C8; --ink: #0A0C12; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  min-height: 100vh; display: grid; place-items: center; text-align: center;
  padding: 32px max(20px, env(safe-area-inset-right, 0px)) 32px max(20px, env(safe-area-inset-left, 0px));
  color: var(--fg); font: 16px/1.55 "Geist", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
  background:
    radial-gradient(900px 600px at 20% 0%, rgba(69, 217, 200, 0.14), transparent 60%),
    radial-gradient(900px 640px at 85% 10%, rgba(80, 110, 255, 0.24), transparent 60%),
    var(--bg);
}
.code { font-family: "Geist Mono", ui-monospace, Consolas, monospace; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--faint); }
h1 { margin: 14px 0 0; font-weight: 600; font-size: clamp(40px, 8vw, 84px); line-height: 0.95; letter-spacing: -0.055em; }
h1 em { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; letter-spacing: -0.02em;
  background: linear-gradient(100deg, var(--fg), var(--accent) 55%, var(--teal)); -webkit-background-clip: text; background-clip: text; color: transparent; padding-right: 0.06em; }
p { margin: 18px auto 0; max-width: 40ch; color: var(--muted); }
.row { margin-top: 30px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
a.btn { display: inline-flex; align-items: center; height: 46px; padding: 0 20px; border-radius: 999px; font-weight: 500; text-decoration: none; color: var(--fg); border: 1px solid rgba(255, 255, 255, 0.16); background: rgba(255, 255, 255, 0.05); }
a.btn.primary { background: var(--fg); color: var(--ink); border-color: transparent; }
a.btn:hover { background: rgba(255, 255, 255, 0.1); }
a.btn.primary:hover { background: #fff; }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <div class="code">Error 404</div>
  <h1>This page <em>doesn't exist.</em></h1>
  <p>The link may be mistyped or out of date. Everything worth seeing is on the home page.</p>
  <div class="row">
    <a class="btn primary" href="/">Go to the portfolio</a>
    <a class="btn" href="/cv/">Open the CV</a>
  </div>
</main>
</body>
</html>
